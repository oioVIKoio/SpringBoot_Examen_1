<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asignar Permisos</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

  <div class="card shadow">

    <div class="card-header">
      <h2>Asignar Permisos</h2>
    </div>

    <div class="card-body">

      <p>
        Rol:
        <strong th:text="${rol.nombre}">
          Rol
        </strong>
      </p>

      <form th:action="@{/roles/permisos/guardar}"
            method="post">

        <input type="hidden"
               name="rolId"
               th:value="${rol.id}">

        <div th:each="permiso : ${permisos}"
             class="form-check mb-2">

          <input class="form-check-input"
                 type="checkbox"
                 name="permisosIds"
                 th:value="${permiso.id}"
                 th:checked="${rol.permisos.contains(permiso)}">

          <label class="form-check-label"
                 th:text="${permiso.nombre}">
            Permiso
          </label>

        </div>

        <div class="mt-4">

          <button type="submit"
                  class="btn btn-primary">
            Guardar permisos
          </button>

          <a th:href="@{/roles}"
             class="btn btn-secondary">
            Cancelar
          </a>

        </div>

      </form>

    </div>

  </div>

</div>

</body>
</html>
