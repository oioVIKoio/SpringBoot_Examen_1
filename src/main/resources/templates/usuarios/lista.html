<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Gestión de Usuarios</h2>
        <a th:href="@{/usuarios/nuevo}" class="btn btn-primary">
            Nuevo Usuario
        </a>
    </div>

    <table class="table table-bordered table-hover bg-white">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>DNI</th>
            <th>Correo</th>
            <th>Área</th>
            <th>Estado</th>
            <th>Acciones</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="usuario : ${usuarios}">
            <td th:text="${usuario.id}"></td>
            <td th:text="${usuario.nombres + ' ' + usuario.apellidos}"></td>
            <td th:text="${usuario.dni}"></td>
            <td th:text="${usuario.correo}"></td>
            <td th:text="${usuario.area}"></td>

            <td>
                <span th:if="${usuario.activo}" class="badge bg-success">Activo</span>
                <span th:unless="${usuario.activo}" class="badge bg-danger">Inactivo</span>
            </td>

            <td>
                <a th:href="@{'/usuarios/editar/' + ${usuario.id}}"
                   class="btn btn-warning btn-sm">
                    Editar
                </a>

                <a th:if="${usuario.activo}"
                   th:href="@{'/usuarios/desactivar/' + ${usuario.id}}"
                   class="btn btn-danger btn-sm">
                    Desactivar
                </a>

                <a th:unless="${usuario.activo}"
                   th:href="@{'/usuarios/activar/' + ${usuario.id}}"
                   class="btn btn-success btn-sm">
                    Activar
                </a>
            </td>
        </tr>
        </tbody>

    </table>

</div>

</body>
</html>
