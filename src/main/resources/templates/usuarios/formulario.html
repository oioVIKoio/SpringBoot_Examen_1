<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Usuario</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header">
            <h2 th:text="${usuarioForm.id == null ? 'Registrar Usuario' : 'Modificar Usuario'}">
                Registrar Usuario
            </h2>
        </div>

        <div class="card-body">

            <form th:action="@{/usuarios/guardar}"
                  th:object="${usuarioForm}"
                  method="post">

                <input type="hidden" th:field="*{id}">

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Nombres</label>
                        <input type="text"
                               class="form-control"
                               th:field="*{nombres}"
                               required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Apellidos</label>
                        <input type="text"
                               class="form-control"
                               th:field="*{apellidos}"
                               required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">DNI</label>
                        <input type="text"
                               class="form-control"
                               th:field="*{dni}"
                               maxlength="8"
                               required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Correo</label>
                        <input type="email"
                               class="form-control"
                               th:field="*{correo}"
                               required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Teléfono</label>
                        <input type="text"
                               class="form-control"
                               th:field="*{telefono}">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Usuario</label>
                        <input type="text"
                               class="form-control"
                               th:field="*{usuario}"
                               required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Contraseña</label>
                        <input type="password"
                               class="form-control"
                               th:field="*{password}"
                               required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Área</label>
                        <input type="text"
                               class="form-control"
                               th:field="*{area}">
                    </div>

                </div>

                <div class="mt-3">

                    <button type="submit" class="btn btn-primary">
                        Guardar
                    </button>

                    <a th:href="@{/usuarios}" class="btn btn-secondary">
                        Cancelar
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

</body>
</html>
