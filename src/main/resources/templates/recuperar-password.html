<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Recuperar Contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center vh-100">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="card shadow">
                <div class="card-body p-4">
                    <h4 class="text-center mb-3">Recuperar Contraseña</h4>

                    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
                    <div th:if="${enlaceRecuperacion}" class="alert alert-info">

                        <p class="mb-2">
                            Enlace de recuperación:
                        </p>

                        <a th:href="${enlaceRecuperacion}"
                           th:text="${enlaceRecuperacion}">
                        </a>

                    </div>
                    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                    <form th:action="@{/recuperar-password}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Correo Institucional / Personal</label>
                            <input type="email" name="correo" class="form-control" placeholder="correo@ejemplo.com" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Enviar Enlace</button>
                    </form>

                    <div class="text-center mt-3">
                        <a th:href="@{/login}">Volver al Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
