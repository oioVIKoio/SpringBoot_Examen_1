<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Permisos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Permisos</h2>
        <a th:href="@{/permisos/nuevo}" class="btn btn-primary">
            Nuevo permiso
        </a>
    </div>

    <table class="table table-bordered">
        <thead>
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Descripción</th>
            <th>Acciones</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="permiso : ${permisos}">
            <td th:text="${permiso.id}"></td>
            <td th:text="${permiso.nombre}"></td>
            <td th:text="${permiso.descripcion}"></td>
            <td>
                <a th:href="@{/permisos/editar/{id}(id=${permiso.id})}"
                   class="btn btn-sm btn-warning">
                    Editar
                </a>
            </td>
        </tr>
        </tbody>
    </table>

    <a th:href="@{/roles}" class="btn btn-secondary">
        Volver a roles
    </a>

</div>

</body>
</html>
