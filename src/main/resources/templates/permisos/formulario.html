<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Permiso</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>

<div class="container mt-4">

    <h2 th:text="${permisoForm.id == null ? 'Nuevo permiso' : 'Editar permiso'}"></h2>

    <form th:action="@{/permisos/guardar}"
          th:object="${permisoForm}"
          method="post">

        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label for="nombre" class="form-label">Nombre</label>
            <input type="text"
                   id="nombre"
                   class="form-control"
                   th:field="*{nombre}"
                   required>
        </div>

        <div class="mb-3">
            <label for="descripcion" class="form-label">Descripción</label>
            <textarea id="descripcion"
                      class="form-control"
                      th:field="*{descripcion}"></textarea>
        </div>

        <button type="submit" class="btn btn-success">
            Guardar
        </button>

        <a th:href="@{/permisos}" class="btn btn-secondary">
            Cancelar
        </a>

    </form>

</div>

</body>
</html>
